<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="description" content="轻清单——把目标拆成每月、每周、每天，自动同步到任务清单。">
  <title>轻清单 · 把目标拆成今天</title>
  <style>
    html { background: #f4f6fb; }
  </style>
  <script>
    (function () {
      let dark = false;
      try {
        const raw = localStorage.getItem("qinglist.state.v1");
        const settings = raw ? JSON.parse(raw).settings : null;
        const mode =
          settings && settings.themeMode
            ? settings.themeMode
            : settings && settings.darkMode
              ? "dark"
              : "system";
        dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
      } catch (error) {
        dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
      const background = dark ? "#11151d" : "#f4f6fb";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.background = background;
      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute("content", background);
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=45">
</head>
<body>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>
  <div class="ambient-grid" aria-hidden="true"></div>

  <div class="app-shell" id="appShell">
    <div class="screen" id="screen">
      <!-- 任务 -->
      <section class="page page--tasks is-active" id="page-tasks" data-page="tasks" aria-label="任务">
        <div class="task-hero">
          <header class="task-header">
            <div class="brand-row">
              <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M7.2 12.4l3.1 3.1 6.6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span>轻清单</span>
              </div>
              <div class="header-actions">
                <button class="icon-button icon-button--ghost" id="todayJump" type="button" aria-label="回到今天" hidden>
                  <svg viewBox="0 0 24 24" fill="none"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 13h3v3H8z" fill="currentColor"/></svg>
                  <span>今天</span>
                </button>
              </div>
            </div>

            <div class="day-heading">
              <div class="day-heading-copy">
                <p class="eyebrow" id="monthEyebrow">2026年11月</p>
                <h1 id="dayTitle">今天</h1>
                <p class="day-sub" id="daySub">11月8日 星期六 · 3 项待办</p>
              </div>
              <div class="progress-orbit" id="progressOrbit" style="--progress:25" role="button" tabindex="0" aria-label="查看今日统计">
                <div class="progress-orbit-inner">
                  <strong id="progressPercent">25%</strong>
                  <span>今日</span>
                </div>
              </div>
            </div>
          </header>

          <div class="date-strip-shell">
            <button class="strip-arrow strip-arrow--left" id="prevDates" type="button" aria-label="向前浏览日期">
              <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 6.5L9 12l5.5 5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="date-strip" id="dateStrip" role="listbox" aria-label="选择日期"></div>
            <button class="strip-arrow strip-arrow--right" id="nextDates" type="button" aria-label="向后浏览日期">
              <svg viewBox="0 0 24 24" fill="none"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="task-content" id="taskContent">
          <div id="overdueList" class="overdue-list" hidden></div>
          <div class="list-heading">
            <div class="list-heading-title">
              <h2>待办</h2>
              <span class="count-pill" id="openCount">3</span>
            </div>
            <span class="longpress-hint">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 11V6.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V12m0-1a1.5 1.5 0 013 0v4.2c0 3.2-2.1 5.3-5.3 5.3h-1.2c-2 0-3.2-.8-4.3-2.2L5.7 15a1.55 1.55 0 012.1-2.2L9 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              长按三点拖动
            </span>
          </div>
          <div id="taskList" class="task-list" aria-live="polite"></div>
        </div>
      </section>

      <!-- 创造 -->
      <section class="page page--create" id="page-create" data-page="create" aria-label="创造" hidden>
        <header class="create-header">
          <div class="brand-row">
            <div class="brand brand--create">
              <span class="brand-mark brand-mark--spark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5l1.55 4.4 4.45 1.6-4.45 1.6L12 15.5l-1.55-4.4L6 9.5l4.45-1.6L12 3.5z" fill="currentColor"/><path d="M18.3 15.2l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z" fill="currentColor"/></svg>
              </span>
              <span>轻清单</span>
            </div>
            <button class="icon-button icon-button--primary" id="newGoalBtn" type="button" aria-label="新建每日习惯">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <p class="eyebrow">MAKE IT HAPPEN</p>
          <h1>创造</h1>
          <p class="create-sub">把想做的事，拆成今天的一小步。</p>
        </header>

        <div class="goal-content">
          <div id="goalList" class="goal-list" aria-live="polite"></div>
          <button class="new-goal-row" id="newGoalInline" type="button">
            <span class="plus-tile" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span class="new-goal-copy">
              <strong>新建目标</strong>
              <small>按天、周或月，拆成可执行的行动</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p class="create-footnote">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8v5m0 3.2v.1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            目标会按周期自动拆解，并同步到任务清单
          </p>
        </div>
      </section>

      <!-- 我的 -->
      <section class="page page--profile" id="page-profile" data-page="profile" aria-label="我的" hidden>
        <header class="profile-header">
          <div class="brand-row">
            <div class="brand">
              <span class="brand-mark brand-mark--quiet" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M7.2 12.4l3.1 3.1 6.6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span>轻清单</span>
            </div>
          </div>
          <p class="eyebrow">PROFILE</p>
          <h1>我的</h1>
          <p class="create-sub">看看进展，整理清单，管理数据。</p>
        </header>
        <div class="global-search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="globalSearchInput" type="search" placeholder="搜索任务、目标、习惯、清单" autocomplete="off">
          <button id="clearGlobalSearch" type="button" aria-label="清空搜索" hidden>
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="globalSearchResults" class="global-search-results" hidden></div>
        <div class="profile-menu">
          <button class="profile-menu-item" type="button" data-profile-action="stats">
            <span class="profile-menu-icon profile-menu-icon--stats" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5h15M6.5 19V13h3v6M10.5 19V9h3v10M14.5 19V5.5h3V19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="profile-menu-copy">
              <strong>统计</strong>
              <small>日完成度 · 周完成度 · 目标完成度</small>
            </span>
            <svg class="profile-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="profile-menu-item" type="button" data-profile-action="lists">
            <span class="profile-menu-icon profile-menu-icon--lists" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M8 6.5h11M8 12h11M8 17.5h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4.6" cy="6.5" r="1.1" fill="currentColor"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1.1" fill="currentColor"/></svg>
            </span>
            <span class="profile-menu-copy">
              <strong>清单</strong>
              <small>自定义工作、生活、成长等分类</small>
            </span>
            <svg class="profile-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="profile-menu-item" type="button" data-profile-action="data">
            <span class="profile-menu-icon profile-menu-icon--data" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="7" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="profile-menu-copy">
              <strong>数据</strong>
              <small>导入备份 · 导出备份 · 清空数据</small>
            </span>
            <svg class="profile-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="profile-menu-item" type="button" data-profile-action="settings">
            <span class="profile-menu-icon profile-menu-icon--settings" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 8.4a3.6 3.6 0 100 7.2 3.6 3.6 0 000-7.2z" stroke="currentColor" stroke-width="1.6"/><path d="M19.1 13.1c.1-.4.1-.7.1-1.1s0-.7-.1-1.1l2-1.6-2-3.4-2.4 1a8 8 0 00-1.9-1.1L14.5 3h-4l-.3 2.8c-.7.3-1.3.7-1.9 1.1l-2.4-1-2 3.4 2 1.6c-.1.4-.1.7-.1 1.1s0 .7.1 1.1l-2 1.6 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.3 2.8h4l.3-2.8c.7-.3 1.3-.7 1.9-1.1l2.4 1 2-3.4-2-1.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
            <span class="profile-menu-copy">
              <strong>设置</strong>
              <small>字体大小与阅读偏好</small>
            </span>
            <svg class="profile-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </section>

      <!-- 每日习惯 -->
      <section class="page page--sub page--habits" id="page-habits" data-page="habits" aria-label="每日习惯" hidden>
        <header class="subpage-head">
          <button class="round-close" type="button" id="habitBack" aria-label="返回创造">
            <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2>每日习惯</h2>
          <span class="subpage-head-spacer" aria-hidden="true"></span>
        </header>
        <div class="subpage-body">
          <p class="subpage-intro">按重复规则自动生成当天任务；完成情况请在任务清单里勾选。</p>
          <div id="habitList" class="habit-list" aria-live="polite"></div>
          <button class="add-task-row" type="button" id="addHabitPageBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>新建习惯</span></button>
        </div>
      </section>

      <!-- 清单管理 -->
      <section class="page page--sub page--lists" id="page-lists" data-page="lists" aria-label="清单" hidden>
        <header class="subpage-head">
          <button class="round-close" type="button" id="listsBack" aria-label="返回我的">
            <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2>清单</h2>
          <button class="icon-button icon-button--primary" type="button" id="newListPage" aria-label="新建清单">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="subpage-body">
          <p class="subpage-intro">任务、目标和每日习惯都可以选择这里的清单。名称和颜色都可以自定义。</p>
          <div class="global-search list-search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="listSearchInput" type="search" placeholder="搜索待办任务" autocomplete="off">
            <button id="clearListSearch" type="button" aria-label="清空清单搜索" hidden>
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="listManagerContent" class="list-manage"></div>
          <button class="add-task-row" type="button" id="addListPageBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>新建清单</span></button>
        </div>
      </section>

      <!-- 清单详情 -->
      <section class="page page--sub page--list-detail" id="page-list-detail" data-page="list-detail" aria-label="清单详情" hidden>
        <header class="subpage-head">
          <button class="round-close" type="button" id="listDetailBack" aria-label="返回清单">
            <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 id="listDetailTitle">清单</h2>
          <span class="subpage-head-spacer" aria-hidden="true"></span>
        </header>
        <div class="subpage-body">
          <p class="subpage-intro" id="listDetailIntro">查看清单里的任务和子任务。</p>
          <div class="list-detail-toolbar">
            <button type="button" id="listSelectAll">全选</button>
            <button type="button" id="listDeleteSelected" disabled>删除所选</button>
          </div>
          <div id="listDetailContent" class="list-detail-content"></div>
        </div>
      </section>

      <!-- 新建目标 / 编辑目标 -->
      <section class="page page--sub page--fullpage" id="page-goal" data-page="goal" aria-label="新建目标" hidden></section>

      <!-- 已归档 -->
      <section class="page page--sub page--fullpage" id="page-archive" data-page="archive" aria-label="已归档" hidden></section>

      <!-- 回收站 -->
      <section class="page page--sub page--fullpage" id="page-trash" data-page="trash" aria-label="回收站" hidden></section>

      <!-- 统计 -->
      <section class="page page--sub page--fullpage" id="page-stats" data-page="stats" aria-label="统计" hidden></section>

      <!-- 统计详情 -->
      <section class="page page--sub page--fullpage" id="page-stats-detail" data-page="stats-detail" aria-label="统计详情" hidden></section>

      <!-- 数据 -->
      <section class="page page--sub page--fullpage" id="page-data" data-page="data" aria-label="数据" hidden></section>

      <!-- 设置 -->
      <section class="page page--sub page--fullpage" id="page-settings" data-page="settings" aria-label="设置" hidden></section>

      <!-- 使用说明 -->
      <section class="page page--sub page--fullpage" id="page-guide" data-page="guide" aria-label="使用说明" hidden></section>
    </div>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-active" type="button" data-tab="tasks" aria-selected="true">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.2l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="tab-badge" id="taskBadge" hidden>0</span>
        </span>
        <span class="tab-label">任务</span>
      </button>
      <button class="tab" type="button" data-tab="create" aria-selected="false">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8l1.7 4.9 4.9 1.7-4.9 1.7-1.7 4.9-1.7-4.9-4.9-1.7 4.9-1.7L12 3.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M18.2 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z" fill="currentColor"/></svg>
        </span>
        <span class="tab-label">创造</span>
      </button>
      <button class="tab" type="button" data-tab="profile" aria-selected="false">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.7" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.6-3.4 3.3-5.5 7-5.5s6.4 2.1 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-scrim" data-close-sheet></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作面板"></div>
  </div>

  <div class="calendar-layer" id="calendarLayer" hidden>
    <div class="calendar-scrim" data-calendar-close></div>
    <div class="calendar-dialog" role="dialog" aria-modal="true" aria-label="选择日期">
      <div class="sheet-grab"></div>
      <header class="calendar-dialog-head">
        <strong id="calendarDialogTitle">选择日期</strong>
        <button class="calendar-dialog-close" type="button" data-calendar-close aria-label="关闭日历">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="calendarHost"></div>
    </div>
  </div>

  <script src="app.js?v=45"></script>
</body>
</html>
